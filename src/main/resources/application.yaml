spring:
  application:
    name: didgeridoo

  config:
    import: "optional:file:./.env[.properties]"

  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:db}"
    username: "${DB_USER:user}"
    password: "${DB_PASSWORD:}"

  jpa:
    hibernate:
      ddl-auto: validate


server:
  port: 8080